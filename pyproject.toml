[project]
name = "trainspotting"
version = "0.1.0"
description = "Audit what fully-open models (OLMo 3) were trained on: stage facts, exact source breakdowns, and LLM-classified value content (helpful / honest / harmless)."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "anthropic>=0.100",
    "zstandard>=0.21",
    "py3langid>=0.3",
]

[project.scripts]
trainspotting = "trainspotting.cli:main"

[project.optional-dependencies]
# Only the grep layer needs duckdb, and only it needs a query engine at all —
# every other layer talks to the datasets-server over HTTP.
grep = ["duckdb>=1.0"]
# Only the bif layer touches model weights. It samples around a checkpoint with
# SGLD, so it is the one command that needs torch, transformers and a GPU.
bif = ["torch>=2.2", "transformers>=4.40"]
# Only the steps layer decodes tokens: Pythia's training order is published as
# token ids, not text, so reading a batch back means the GPT-NeoX tokenizer.
steps = ["tokenizers>=0.15"]
dev = ["pytest>=8", "duckdb>=1.0", "tokenizers>=0.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trainspotting*"]

[tool.ruff.lint]
# Ruff's own default set, written down. Unwritten, it is whatever the ruff on the
# machine happens to default to, and a ruff release then turns an unrelated pull
# request red — which is how this section came to exist: CI installed an
# unpinned ruff, picked up some forty newly-defaulted rules, and failed a branch
# that changed none of the code they fired on.
#
# `E501` is deliberately out, and is why this is not simply `E`. The prose in
# this repo — module docstrings that explain why a layer exists, and Markdown
# tables in the README — is wrapped for reading rather than to a column, and a
# line-length rule would either rewrap the explanations or be suppressed
# everywhere they are.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
