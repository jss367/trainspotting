[project]
name = "trainspotting"
version = "0.1.0"
description = "Audit what fully-open models (OLMo 3) were trained on: stage facts, exact source breakdowns, and LLM-classified value content (helpful / honest / harmless)."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "anthropic>=0.100",
    "zstandard>=0.21",
    "py3langid>=0.3",
]

[project.scripts]
trainspotting = "trainspotting.cli:main"

[project.optional-dependencies]
# Only the grep layer needs duckdb, and only it needs a query engine at all —
# every other layer talks to the datasets-server over HTTP.
grep = ["duckdb>=1.0"]
dev = ["pytest>=8", "duckdb>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trainspotting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
